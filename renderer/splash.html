<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; height: 100vh;
    background: #0a0a1a;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #c9a54e;
    font-family: 'SimHei', 'Microsoft YaHei', sans-serif;
    user-select: none; overflow: hidden;
    border: 1px solid #2a2136;
  }
  .logo { width: 84px; height: 84px; margin-bottom: 14px; }
  .logo img { width: 100%; height: 100%; object-fit: contain; }
  .title { font-size: 26px; letter-spacing: 8px; margin-bottom: 8px; }
  .sub { font-size: 10px; letter-spacing: 2px; color: #6e6478; margin-bottom: 26px; }
  .hint { font-size: 12px; color: #96909f; margin-bottom: 14px; letter-spacing: 1px; }
  .loader { width: 220px; height: 3px; background: #1a1a3a; border-radius: 2px; overflow: hidden; }
  .loader-bar {
    height: 100%; width: 30%;
    background: linear-gradient(90deg, #7d5a1e, #c9a54e);
    animation: load 1.4s ease-in-out infinite;
  }
  @keyframes load {
    0% { width: 6%; }
    50% { width: 78%; }
    100% { width: 6%; }
  }
</style>
</head>
<body>
  <div class="logo"><img src="../resources/icon.png" alt=""></div>
  <div class="title">谨 遵 指 令</div>
  <div class="sub">THE INDEX COMMAND SIMULATOR</div>
  <div class="hint">正在载入数据…</div>
  <div class="loader"><div class="loader-bar"></div></div>
</body>
</html>
